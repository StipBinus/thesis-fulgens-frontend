name: thesis_fulgens_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  flutter_svg: ^2.2.2
  google_fonts: ^6.2.1
  rive: ^0.14.11
  record: ^7.1.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app/
    - assets/app/SelectionPage/
    - assets/game/
